<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 Telegram Bot Webhook</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        h1 { color: #fff; text-align: center; margin-bottom: 10px; font-size: 28px; }
        .subtitle { color: #88f; text-align: center; margin-bottom: 30px; font-size: 14px; }
        .info-box {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .info-box p { color: #0f8; font-size: 14px; line-height: 1.6; word-break: break-all; }
        .btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn.green { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .btn.red { background: linear-gradient(135deg, #e53935 0%, #e35d5b 100%); }
        .result {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .result.show { display: block; }
        .result h3 { color: #fff; margin-bottom: 10px; }
        .result pre {
            color: #8f8;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
        }
        .success { color: #0f8; }
        .error { color: #f44; }
        .loading {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .warn {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .warn p { color: #ffc107; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 设置 Webhook</h1>
        <p class="subtitle">直接调用 Telegram API 设置 Webhook</p>
        
        <div class="info-box">
            <p>📡 Webhook URL:</p>
            <p id="webhookUrl" style="color:#fff;margin-top:5px;"></p>
        </div>

        <div class="warn">
            <p>⚠️ 需要能访问 api.telegram.org（可能需要VPN）</p>
        </div>
        
        <button class="btn" id="setupBtn" onclick="setupWebhook()">
            🔗 设置 Webhook
        </button>
        
        <button class="btn green" id="infoBtn" onclick="getWebhookInfo()">
            🔍 查看当前 Webhook 状态
        </button>

        <button class="btn red" id="deleteBtn" onclick="deleteWebhook()">
            🗑️ 删除 Webhook
        </button>
        
        <div class="result" id="result">
            <h3 id="resultTitle">结果</h3>
            <pre id="resultContent"></pre>
        </div>
    </div>

    <script>
        var BOT_TOKEN = new URLSearchParams(window.location.search).get('token') || '8979472034:AAF4E2qOXRiTsZWjlX5Kepxb47Eyy_QvHwk';
        var WEBHOOK_URL = new URLSearchParams(window.location.search).get('webhook') || 'https://www.mohuan.asia/api/webhook';
        var API_BASE = 'https://api.telegram.org/bot' + BOT_TOKEN;

        document.getElementById('webhookUrl').textContent = WEBHOOK_URL;

        function showResult(title, content, isError) {
            var resultDiv = document.getElementById('result');
            var resultTitle = document.getElementById('resultTitle');
            var resultContent = document.getElementById('resultContent');
            resultDiv.classList.add('show');
            resultTitle.className = isError ? 'error' : 'success';
            resultTitle.textContent = title;
            resultContent.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
        }

        async function setupWebhook() {
            var btn = document.getElementById('setupBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 设置中...';
            
            try {
                var response = await fetch(API_BASE + '/setWebhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: WEBHOOK_URL,
                        drop_pending_updates: true
                    })
                });
                var data = await response.json();
                if (data.ok) {
                    showResult('✅ Webhook 设置成功！', data, false);
                } else {
                    showResult('❌ Webhook 设置失败', data, true);
                }
            } catch (error) {
                showResult('❌ 请求失败', error.message + '\n\n可能原因：无法访问 api.telegram.org\n请确保你的网络可以访问该地址（可能需要VPN）', true);
            }
            
            btn.disabled = false;
            btn.innerHTML = '🔗 设置 Webhook';
        }
        
        async function getWebhookInfo() {
            var btn = document.getElementById('infoBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 获取中...';
            
            try {
                var response = await fetch(API_BASE + '/getWebhookInfo');
                var data = await response.json();
                if (data.ok) {
                    showResult('📋 Webhook 信息', data.result, false);
                } else {
                    showResult('❌ 获取失败', data, true);
                }
            } catch (error) {
                showResult('❌ 请求失败', error.message + '\n\n可能原因：无法访问 api.telegram.org\n请确保你的网络可以访问该地址（可能需要VPN）', true);
            }
            
            btn.disabled = false;
            btn.innerHTML = '🔍 查看当前 Webhook 状态';
        }

        async function deleteWebhook() {
            var btn = document.getElementById('deleteBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 删除中...';
            
            try {
                var response = await fetch(API_BASE + '/deleteWebhook', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ drop_pending_updates: true })
                });
                var data = await response.json();
                if (data.ok) {
                    showResult('✅ Webhook 已删除', data, false);
                } else {
                    showResult('❌ 删除失败', data, true);
                }
            } catch (error) {
                showResult('❌ 请求失败', error.message + '\n\n可能原因：无法访问 api.telegram.org\n请确保你的网络可以访问该地址（可能需要VPN）', true);
            }
            
            btn.disabled = false;
            btn.innerHTML = '🗑️ 删除 Webhook';
        }
    </script>
</body>
</html>
