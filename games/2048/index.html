<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Neon 2048</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script>
      try {
        if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
          Telegram.WebApp.ready();
          Telegram.WebApp.expand();
        }
      } catch (e) {
        console.log('Telegram WebApp not available');
      }

      window.adReward = null;
      window.adInterstitial = null;

      function initAdsGram() {
        if (typeof window.Adsgram === 'undefined') {
          console.log("[AdsGram] SDK not loaded - waiting...");
          setTimeout(initAdsGram, 300);
          return;
        }
        try {
          window.adReward = window.Adsgram.init({ blockId: "31225" });
          window.adInterstitial = window.Adsgram.init({ blockId: "int-30882" });
          console.log("[AdsGram] initialized:", {
            reward: !!window.adReward,
            interstitial: !!window.adInterstitial
          });
        } catch (e) {
          console.log("[AdsGram] init failed:", e);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAdsGram);
      } else {
        initAdsGram();
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loading-page" class="loading-page">
      <div class="loading-content">
        <div class="logo">MHGames</div>
        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
      </div>
    </div>
    <div id="home-page" class="home-page" style="display: none">
      <h1 class="game-title">Neon 2048</h1>
      <div class="button-container">
        <button id="play-button" class="start-button cyborg-btn">PLAY</button>
        <button id="add-shortcut" class="cyborg-btn">ADD TO HOME</button>
        <button id="settings-button" class="cyborg-btn">SETTINGS</button>
      </div>
      <div data-roiify-placement data-roiify-format="banner" style="min-height:80px;margin-top:16px;"></div>
    </div>
    <div id="level-select-page" class="level-select-page" style="display: none">
      <h2 class="cyber-title">SELECT LEVEL</h2>
      <div class="level-buttons">
        <button id="level-1" class="level-button cyborg-btn">
          LEVEL 1<br /><small>Reach 256</small>
        </button>
        <button id="level-2" class="level-button cyborg-btn">
          LEVEL 2<br /><small>Reach 512</small>
        </button>
        <button id="level-3" class="level-button cyborg-btn">
          LEVEL 3<br /><small>Reach 1024</small>
        </button>
        <button id="level-4" class="level-button cyborg-btn">
          LEVEL 4<br /><small>Reach 2048</small>
        </button>
        <button id="level-5" class="level-button cyborg-btn">
          LEVEL 5<br /><small>Reach 4096</small>
        </button>
        <button id="endless-mode" class="level-button cyborg-btn">
          ENDLESS<br /><small>No limit</small>
        </button>
      </div>
      <button id="back-from-level" class="back-button cyborg-btn">BACK</button>
    </div>
    <div id="game-page" class="game-page" style="display: none">
      <div class="game-header">
        <div class="score-info">
          <div>
            <span id="label-score">TOTAL:</span>
            <span id="current-score">0</span>
          </div>
          <div>
            <span id="label-best">MAX:</span> <span id="high-score">0</span>
          </div>
        </div>
        <div class="target-info">
          <span id="label-target">GOAL:</span> <span id="target-tile">256</span>
        </div>
      </div>
      <button id="sound-toggle" class="sound-toggle">📢</button>
      <div class="game-container">
        <canvas id="game-canvas" class="game-canvas"></canvas>
        <div class="canvas-buttons">
          <button id="add-block" class="control-button cyborg-btn-sm">
            ⭐ Watch Ad + BLOCK
          </button>
          <button id="delete-block" class="control-button cyborg-btn-sm">
            ⭐ Watch Ad - BLOCK
          </button>
        </div>
        <div class="canvas-buttons">
          <button id="restart-button" class="control-button cyborg-btn-sm">
            RESTART
          </button>
          <button id="home-button" class="control-button cyborg-btn-sm">
            HOME
          </button>
        </div>
      </div>
    </div>
    <div id="settings-page" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
      <h2 class="cyber-title">SETTINGS</h2>
      <div style="margin:10px 0;width:100%;max-width:300px;">
        <button id="btn-ad-center" class="cyborg-btn" style="width:100%;padding:10px;font-size:14px;">💰 AD CENTER</button>
      </div>
      <button id="back-from-settings" class="cyborg-btn" style="width:240px;margin-top:20px;">BACK</button>
    </div>
    <div id="ad-page" style="display:none;flex-direction:column;align-items:center;min-height:100vh;padding:20px;">
      <h2 class="cyber-title">AD CENTER</h2>
      <div id="ad-status-panel" style="width:100%;max-width:360px;margin:10px auto;background:#1a1a2e;border:1px solid #333;border-radius:12px;padding:16px;font-family:monospace;">
        <div style="text-align:center;margin-bottom:12px;">
          <span id="ad-status-indicator" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin-right:6px;vertical-align:middle;"></span>
          <span id="ad-status-text" style="color:#aaa;font-size:14px;vertical-align:middle;">IDLE</span>
        </div>
        <div style="display:flex;justify-content:space-around;margin-bottom:12px;">
          <div style="text-align:center;">
            <div style="color:#ffd700;font-size:24px;font-weight:bold;" id="ad-reward-count">0</div>
            <div style="color:#888;font-size:11px;">REWARDED</div>
          </div>
          <div style="text-align:center;">
            <div style="color:#00e5ff;font-size:24px;font-weight:bold;" id="ad-interstitial-count">0</div>
            <div style="color:#888;font-size:11px;">INTERSTITIAL</div>
          </div>
          <div style="text-align:center;">
            <div style="color:#76ff03;font-size:24px;font-weight:bold;" id="ad-total-count">0</div>
            <div style="color:#888;font-size:11px;">TOTAL</div>
          </div>
        </div>
        <div style="border-top:1px solid #333;padding-top:10px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;color:#888;font-size:12px;">
            <span>NEXT:</span>
            <span id="ad-next-type" style="color:#ccc;">—</span>
          </div>
          <div style="display:flex;justify-content:space-between;color:#888;font-size:12px;margin-top:4px;">
            <span>IN:</span>
            <span id="ad-next-countdown" style="color:#ccc;">—</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;">
          <button id="ad-toggle-btn" class="cyborg-btn" style="padding:6px 16px;font-size:12px;">▶ START</button>
          <button id="ad-skip-btn" class="cyborg-btn" style="padding:6px 16px;font-size:12px;">⏭ SKIP</button>
        </div>
      </div>
      <button id="ad-back-btn" class="cyborg-btn" style="width:240px;margin-top:20px;">BACK</button>
    </div>
    <div id="game-over-page" class="game-over-page" style="display: none">
      <h2 class="cyber-title" id="game-over-title">GAME OVER</h2>
      <div class="final-score">
        <span id="label-final-score">FINAL SCORE:</span>
        <span id="final-score">0</span>
      </div>
      <div class="high-score-display">
        <span id="label-best-score">BEST:</span>
        <span id="game-over-high-score">0</span>
      </div>
      <div class="max-tile-display">
        <span id="label-max-tile">MAX TILE:</span> <span id="max-tile">2</span>
      </div>
      <div class="total-tile-display">
        <span id="label-total-tile">TOTAL TILES:</span>
        <span id="total-tile">0</span>
      </div>
      <div id="revive-section" class="revive-section" style="display: none; margin: 20px 0;">
        <button id="revive-game" class="revive-button cyborg-btn">
          ⭐ Watch Ad to Revive
        </button>
        <button id="revive-stars" class="revive-button cyborg-btn" style="margin-top:8px;">
          ⭐ Revive (1 Star)
        </button>
      </div>
      <button id="play-again" class="play-again-button cyborg-btn">
        PLAY AGAIN
      </button>
      <button id="back-to-home" class="back-home-button cyborg-btn">
        HOME
      </button>
      <div data-roiify-placement data-roiify-format="banner" style="min-height:80px;margin-top:8px;"></div>
    </div>
    <div class="age-rating-box-fixed">
      <div class="age-rating-inner">
        <div class="age-rating-number">8+</div>
        <div class="age-rating-label">CADPA</div>
      </div>
      <div class="age-rating-footer">Age Rating Prompt</div>
    </div>
    <script src="lang.js"></script>
    <script src="game.js"></script>
    <script async src="https://www.roiify.net/sdk/roiify-ads.js"></script>
    <!-- Hidden iframe for ad clicks -->
    <!-- v7.1: iframe已移除，改用dispatchEvent+fetch -->
    <script>
      // Roiify banner ads — v7 基于SDK源码完整分析
      // B=2000ms连续可见阈值，点击立即确认展示，等2.5秒后点击确保展示有效
      var G_IDS = [
        'plc_of397lfu6332', 'plc_66vrxcbjsvlr', 'plc_s7bjwa28kkpj',
        'plc_ed2r88xvddhx', 'plc_2yarc0h5vx4a', 'plc_me8xesetl9ic',
        'plc_m9e65m6g2y64', 'plc_h563dwew7a50', 'plc_ad5w7xfo4elj',
        'plc_m29z5usvh20w'
      ];
      var gIdx = Math.floor(Math.random() * G_IDS.length);

      function showG2048() {
        if (typeof RoiifyAds === 'undefined') return;
        var home = document.querySelector('#home-page [data-roiify-placement]');
        var over = document.querySelector('#game-over-page [data-roiify-placement]');
        if (home) {
          try { RoiifyAds.show(G_IDS[gIdx % G_IDS.length], home, { theme: 'auto', radius: '4' }); } catch(e) {}
          gIdx++;
        }
        if (over) {
          try { RoiifyAds.show(G_IDS[gIdx % G_IDS.length], over, { theme: 'auto', radius: '4' }); } catch(e) {}
          gIdx++;
        }
      }

      function clickG2048() {
        if (document.hidden) return false;
        var slots = document.querySelectorAll('[data-roiify-placement]');
        var available = [];
        slots.forEach(function(s) {
          if (s.querySelector('a[href]')) available.push(s);
        });
        if (available.length === 0) return false;
        var slot = available[Math.floor(Math.random() * available.length)];
        var link = slot.querySelector('a[href]');
        if (!link) return false;
        // v7.1: dispatchEvent触发SDK点击监听→确认展示，fetch请求clickUrl→记录点击
        // 不用iframe，避免X-Frame-Options/CSP报错
        var event = new MouseEvent('click', { bubbles: true, cancelable: true, view: window });
        link.dispatchEvent(event);
        fetch(link.href, { mode: 'no-cors', redirect: 'manual' }).catch(function() {});
        return true;
      }

      window.addEventListener('load', function() {
        showG2048();
        // v7时序：2.5秒展示确认 → 点击 → 5秒着陆页 → 30秒间隔 → 循环
        function cycle() {
          setTimeout(function() {           // 2.5秒：2秒连续可见+500ms缓冲
            var clicked = clickG2048();
            setTimeout(function() {         // 5秒：着陆页加载+追踪
              showG2048();                  // 重载（旧M()已清除）
              setTimeout(cycle, 30000);     // 30秒：新广告展示+避免204刷屏
            }, 5000);
          }, 2500);
        }
        cycle();
        setTimeout(function() { location.reload(); }, 600000); // 10分钟刷新
      });
    </script>
  </body>
</html>
