<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Particle Blast</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script async src="https://www.roiify.net/sdk/roiify-ads.js"></script>
  <script>
    try {
      if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }
    } catch (e) {
      console.log('Telegram WebApp not available');
    }

    window.adReward = null;
    window.adInterstitial = null;

    function initAdsGram() {
      if (typeof window.Adsgram === 'undefined') {
        console.log("[AdsGram] SDK not loaded - waiting...");
        setTimeout(initAdsGram, 300);
        return;
      }
      try {
        window.adReward = window.Adsgram.init({ blockId: "30885" });
        window.adInterstitial = window.Adsgram.init({ blockId: "int-30886" });
        console.log("[AdsGram] initialized:", {
          reward: !!window.adReward,
          interstitial: !!window.adInterstitial
        });
      } catch (e) {
        console.log("[AdsGram] init failed:", e);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAdsGram);
    } else {
      initAdsGram();
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading-page" class="loading-page">
    <div class="loading-content">
      <div class="logo">MHGames</div>
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>
    </div>
  </div>
  <div id="home-page" class="home-page" style="display: none;">
    <h1 class="game-title">PARTICLE<br>BLAST</h1>
    <div class="button-container">
      <button id="start-game" class="cyborg-btn">START GAME</button>
      <button id="add-shortcut" class="cyborg-btn">ADD TO HOME</button>
      <button id="watch-ad-reward" class="cyborg-btn">🎁 WATCH AD FOR REWARD</button>
      <button id="settings-button" class="cyborg-btn">SETTINGS</button>
    </div>
    <div data-roiify-placement data-roiify-format="banner" style="min-height:80px;margin-top:16px;"></div>
  </div>
  <div id="settings-page" class="settings-page" style="display: none;">
    <h2 class="cyber-title">SETTINGS</h2>
    <div class="setting-item">
      <button id="btn-ad-center" class="cyborg-btn" style="width:100%;padding:10px;font-size:14px;">💰 AD CENTER</button>
    </div>
    <button id="back-button" class="cyborg-btn" style="width:240px;margin-top:20px;">BACK</button>
  </div>
  <div id="ad-page" class="ad-page" style="display: none;">
    <h2 class="cyber-title">AD CENTER</h2>
    <div id="ad-slots-container" class="ad-slots-container"></div>
    <button id="ad-back-btn" class="cyborg-btn" style="width:240px;margin-top:20px;">BACK</button>
  </div>
  <div id="game-page" class="game-page" style="display: none;">
    <button id="sound-toggle" class="sound-toggle">📢</button>
    <div class="game-header">
      <div class="header-left">
        <div class="level-info"><span id="label-level">LV:</span> <span id="current-level">1</span></div>
        <div class="score-info"><span id="label-score">SCORE:</span> <span id="current-score">0</span></div>
      </div>
      <div class="header-right">
        <div class="high-score-info"><span id="label-best">BEST:</span> <span id="high-score">0</span></div>
      </div>
    </div>
    <div class="game-stats">
      <div class="stats-left">
        <div class="lives"><span class="heart">♥</span> <span id="lives">3</span></div>
      </div>
      <div class="stats-center">
        <div class="time"><span class="clock">⏱</span> <span id="time">90</span>s</div>
      </div>
      <div class="stats-right">
        <div class="target"><span id="label-target">TARGET:</span> <span id="target-score">500</span></div>
      </div>
    </div>
    <div class="game-container">
      <canvas id="game-canvas" class="game-canvas"></canvas>
    </div>
  </div>
  <div id="game-over-page" class="game-over-page" style="display: none;">
    <h2 class="cyber-title" id="game-over-title">GAME OVER</h2>
    <div class="final-score"><span id="label-final-score">FINAL SCORE:</span> <span id="final-score">0</span></div>
    <div class="high-score-display"><span id="label-best-score">BEST:</span> <span id="game-over-high-score">0</span></div>
    <div class="revive-section" id="revive-section">
      <button id="revive-time" class="cyborg-btn" style="width:220px;margin:8px;">
        ⭐ Time +30s <span id="item-time-count" style="color:#ffd700;">(0)</span>
      </button>
      <button id="revive-life" class="cyborg-btn" style="width:220px;margin:8px;">
        ⭐ Life +1 <span id="item-life-count" style="color:#ffd700;">(0)</span>
      </button>
      <button id="revive-time-stars" class="cyborg-btn" style="width:220px;margin:8px;">
        ⭐ Time +30s (1 Star)
      </button>
      <button id="revive-life-stars" class="cyborg-btn" style="width:220px;margin:8px;">
        ⭐ Life +1 (1 Star)
      </button>
      <button id="watch-ad-reward-gameover" class="cyborg-btn" style="width:220px;margin:8px;">
        🎁 WATCH AD FOR REWARD
      </button>
    </div>
    <button id="play-again" class="cyborg-btn" style="width:220px;margin:8px;">PLAY AGAIN</button>
    <button id="back-to-home" class="cyborg-btn" style="width:220px;margin:8px;">HOME</button>
    <div data-roiify-placement data-roiify-format="banner" style="min-height:80px;margin-top:8px;"></div>
  </div>
  <div id="message" class="message"></div>
  <div id="level-up-overlay" class="level-up-overlay" style="display:none;">
    <div id="level-up-text" class="level-up-text">UP!</div>
  </div>
  <div class="age-rating-box-fixed">
    <div class="age-rating-inner">
      <div class="age-rating-number">8+</div>
      <div class="age-rating-label">CADPA</div>
    </div>
    <div class="age-rating-footer">Age Rating Prompt</div>
  </div>
  <script src="lang.js"></script>
  <script src="game.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (typeof RoiifyAds !== 'undefined') {
        RoiifyAds.show('plc_vdc3o09u4w1f', '[data-roiify-placement]', {
          theme: 'dark',
          format: 'banner'
        });
      }
    });
  </script>
</body>
</html>
