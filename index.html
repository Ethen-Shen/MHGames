<!DOCTYPE html>
<html lang="zh-CN" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨焕科技 - MH Games</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #e5e7eb;
            --logo-fill: #1a1a1a;
            --transition-speed: 0.3s;
        }

        :root.dark-theme {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-color: #818cf8;
            --accent-hover: #6366f1;
            --border-color: #2d2d44;
            --logo-fill: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        /* Logo Container */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-svg {
            width: 56px;
            height: 56px;
            transition: filter var(--transition-speed);
        }

        .logo-svg .logo-path {
            fill: var(--logo-fill);
            transition: fill var(--transition-speed);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            transition: color var(--transition-speed);
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            transition: color var(--transition-speed);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition-speed), border-color var(--transition-speed);
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-speed);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 主题切换开关 */
        .theme-toggle {
            position: relative;
            width: 72px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50px;
            background: var(--accent-color);
            border: 2px solid var(--border-color);
            display: inline-block;
            cursor: pointer;
            transition: all var(--transition-speed);
        }

        .theme-toggle:hover {
            border-color: var(--accent-hover);
        }

        .theme-toggle-input {
            display: none;
        }

        .theme-toggle-fill {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 滑块 */
        .theme-toggle-thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            height: 32px;
            width: 32px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            transition: transform var(--transition-speed);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        /* 太阳图标 */
        .sun-icon {
            position: absolute;
            width: 18px;
            height: 18px;
            opacity: 1;
            transition: opacity var(--transition-speed);
        }

        .sun-icon svg {
            width: 100%;
            height: 100%;
            fill: #fbbf24;
        }

        /* 月亮图标 */
        .moon-icon {
            position: absolute;
            width: 18px;
            height: 18px;
            opacity: 0;
            transition: opacity var(--transition-speed);
        }

        .moon-icon svg {
            width: 100%;
            height: 100%;
            fill: #818cf8;
        }

        /* 选中状态（暗色主题） */
        .theme-toggle-input:checked ~ .theme-toggle-fill .theme-toggle-thumb {
            transform: translateX(32px);
        }

        .theme-toggle-input:checked ~ .theme-toggle-fill .sun-icon {
            opacity: 0;
        }

        .theme-toggle-input:checked ~ .theme-toggle-fill .moon-icon {
            opacity: 1;
        }

        .btn-lang {
            background: var(--accent-color);
            color: white;
        }

        .btn-lang:hover {
            background: var(--accent-hover);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 40px;
            background: linear-gradient(135deg, var(--accent-color)15%, transparent 50%);
            transition: background var(--transition-speed);
        }

        .hero-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--accent-color), #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Games Grid */
        .games-section {
            padding: 60px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            color: var(--text-primary);
            transition: color var(--transition-speed);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .game-card {
            background: var(--bg-card);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all var(--transition-speed);
            border: 1px solid var(--border-color);
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.2);
        }

        .game-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .game-image::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.1));
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .game-icon {
            font-size: 64px;
            position: relative;
            z-index: 1;
        }

        .game-info {
            padding: 24px;
        }

        .game-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            transition: color var(--transition-speed);
        }

        .game-description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-color);
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-play {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-color), #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed);
        }

        .btn-play:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        /* Roiify Ad Slot */
        .roiify-ad-slot {
            text-align: center;
            padding: 12px 40px;
        }

        .roiify-ad-slot-sticky {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            z-index: 1000;
            transition: background var(--transition-speed), border-color var(--transition-speed);
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            padding: 40px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
            margin-bottom: 80px;
            transition: background var(--transition-speed), border-color var(--transition-speed);
        }

        .footer-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .footer-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            .logo-svg {
                width: 44px;
                height: 44px;
            }

            .logo-title {
                font-size: 18px;
            }

            .hero {
                padding: 40px 20px;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-subtitle {
                font-size: 16px;
            }

            .games-section {
                padding: 40px 20px;
            }

            .btn {
                padding: 8px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>

            }
        };

        let currentLang = 'zh';
        let isDark = false;

        function loadLanguage(lang) {
            document.getElementById('html-root').lang = lang;
            
            const elements = [
                'logo-title', 'logo-subtitle', 'lang-text', 
                'hero-title', 'hero-subtitle', 'section-title',
                'game1-title', 'game1-desc', 'tag1-1', 'tag1-2', 'tag1-3',
                'game2-title', 'game2-desc', 'tag2-1', 'tag2-2', 'tag2-3',
                'play-text', 'play-text2', 'footer-text'
            ];

            elements.forEach(id => {
                const elem = document.getElementById(id);
                if (elem) {
                    elem.innerHTML = translations[lang][id];
                }
            });

            // Update language icon
            const langIcon = document.getElementById('lang-icon');
            langIcon.textContent = lang === 'zh' ? '🌐' : '🇨🇳';
        }

        function toggleTheme() {
            isDark = !isDark;
            
            if (isDark) {
                document.documentElement.classList.add('dark-theme');
                document.getElementById('theme-toggle-input').checked = true;
            } else {
                document.documentElement.classList.remove('dark-theme');
                document.getElementById('theme-toggle-input').checked = false;
            }
            
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            loadLanguage(currentLang);
            localStorage.setItem('lang', currentLang);
        }

        function openGame(game) {
            const urls = {
                '2048': 'games/2048/index.html',
                'particle': 'games/particle/index.html',
                'findcow': 'games/findcow/index.html'
            };
            window.open(urls[game], '_blank');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Load saved theme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                isDark = true;
                document.documentElement.classList.add('dark-theme');
                document.getElementById('theme-toggle-input').checked = true;
            }

            // Load saved language
            const savedLang = localStorage.getItem('lang');
            if (savedLang) {
                currentLang = savedLang;
                loadLanguage(savedLang);
            }

            // Add event listeners
            document.getElementById('theme-toggle-input').addEventListener('change', toggleTheme);
            document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);
        });
    </script>
